name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Bump this tag whenever the ONNX model is replaced — invalidates the cache and re-downloads.
  MODEL_RELEASE_TAG: ml-model-v1
  MODEL_PATH: src/main/resources/models/custom_convnext_embeddings.onnx

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Cache ONNX model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_PATH }}
          key: onnx-model-${{ env.MODEL_RELEASE_TAG }}

      - name: Download ONNX model from Release
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          gh release download "$MODEL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'custom_convnext_embeddings.onnx' \
            --output "$MODEL_PATH" \
            --clobber
          ls -lh "$MODEL_PATH"

      # `pr-gate` profile runs the unit baseline plus the smoke and
      # integration tiers and the fast (non-nightly-only) ml-it tests.
      # E2E still runs as a separate step below — both existing E2E
      # drivers are kept in PR for cheap JAR-shading regression coverage.
      - name: Build and run PR test gate (unit + smoke + integration + fast ml-it)
        run: mvn -B -ntp clean verify -P pr-gate

      # End-to-end tests spawn real Paper / Purpur subprocesses from
      # Servers/1.8 and Servers/1.21 (both checked into the repo) and
      # consume the plugin JAR that antrun just dropped into
      # Servers/<v>/plugins/ during `mvn verify`. The `e2e` profile
      # narrows surefire to `**/e2e/**Test.java`; MLIntegrationTest is
      # explicitly excluded from this run and handled separately below.
      - name: Run end-to-end tests (Paper/Purpur subprocess)
        run: mvn -B -ntp surefire:test -Pe2e

      # ML integration test loads the real ONNX embedder (cached in
      # the earlier step) and probes available backends. Runs on CPU
      # under the GitHub runner; no GPU is expected.
      - name: Run ML integration tests (ONNX backends)
        run: mvn -B -ntp surefire:test -Pml-it

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/**
            target/*.log
          if-no-files-found: ignore
          retention-days: 7

      # CD deploys only the -lite JAR (no Apache Ignite shaded in) — the VPS
      # is intentionally lightweight and uses the local JSON data provider,
      # so the ~50 MB of Ignite is dead weight. The full JAR is still produced
      # and tested by `mvn verify`; we just don't ship it.
      - name: Upload plugin JAR (lite)
        if: success() && matrix.java == 21
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/buildbattleai-*-lite.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-mc-1.8
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SERVICE: mc-1.8.service
      REMOTE_ROOT: /opt/mc-1.8
    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist/

      - name: Identify lite JAR
        id: pick
        run: |
          set -euo pipefail
          JAR=$(ls dist/buildbattleai-*-lite.jar | head -n1)
          test -n "$JAR" || { echo "No lite JAR in dist/" >&2; ls -la dist/ >&2; exit 1; }
          echo "jar=$JAR" >>"$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)" >>"$GITHUB_OUTPUT"
          ls -la "$JAR"

      - name: Set up SSH ControlMaster
        id: ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh ~/.ssh/cd-ctrl
          chmod 700 ~/.ssh ~/.ssh/cd-ctrl
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/cd_ed25519
          chmod 600 ~/.ssh/cd_ed25519
          # Trust host key (pinned via ssh-keyscan now; future improvement: store known fingerprint as secret)
          for i in 1 2 3 4 5; do
            if ssh-keyscan -t ed25519 -T 8 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying..."
            sleep $((i * 3))
          done
          test -s ~/.ssh/known_hosts || { echo "Failed to keyscan $VPS_HOST" >&2; exit 1; }
          # Open ControlMaster with retries — sshd MaxStartups drops under brute-force flood
          SSH_BASE="-i $HOME/.ssh/cd_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cd-ctrl/sock -o ControlPersist=300 -o ConnectTimeout=15"
          echo "ssh_base=$SSH_BASE" >>"$GITHUB_OUTPUT"
          for i in 1 2 3 4 5 6 7 8; do
            if ssh $SSH_BASE -fN "$VPS_USER@$VPS_HOST" 2>/dev/null; then
              echo "ControlMaster established on attempt $i"
              break
            fi
            echo "ControlMaster attempt $i failed; backoff..."
            sleep $((i * 3))
            if [ $i -eq 8 ]; then
              echo "Could not establish SSH ControlMaster after 8 attempts" >&2
              exit 1
            fi
          done
          ssh $SSH_BASE -O check "$VPS_USER@$VPS_HOST"

      - name: Upload JAR to staging
        run: |
          set -euo pipefail
          SSH_BASE="${{ steps.ssh.outputs.ssh_base }}"
          STAGED="buildbattleai-${{ steps.pick.outputs.short_sha }}.jar"
          # rsync over the shared control socket — no new auth handshake
          rsync -av --no-perms --no-times --no-owner --no-group \
            -e "ssh $SSH_BASE" \
            "${{ steps.pick.outputs.jar }}" \
            "$VPS_USER@$VPS_HOST:$REMOTE_ROOT/plugins-staging/$STAGED"

      - name: Swap JAR & restart service
        env:
          SHORT_SHA: ${{ steps.pick.outputs.short_sha }}
        run: |
          set -euo pipefail
          SSH_BASE="${{ steps.ssh.outputs.ssh_base }}"
          ssh $SSH_BASE "$VPS_USER@$VPS_HOST" bash -se <<'REMOTE'
            set -euo pipefail
            cd "$HOME"
            ROOT="/opt/mc-1.8"
            cd "$ROOT"

            # Latest staged JAR (the one we just rsynced)
            STAGED=$(ls -t plugins-staging/buildbattleai-*.jar 2>/dev/null | head -n1)
            [ -n "$STAGED" ] || { echo "No staged JAR found in $ROOT/plugins-staging/" >&2; exit 1; }
            echo "Staged: $STAGED"

            echo "::Stopping service::"
            sudo -n /usr/bin/systemctl stop mc-1.8.service

            # Archive currently-installed JAR(s), keep last 5
            shopt -s nullglob
            for old in plugins/buildbattleai-*.jar; do
              ts=$(date +%Y%m%d-%H%M%S)
              base=$(basename "$old")
              mv -v "$old" "plugins-archive/${ts}-${base}"
            done
            ls -1t plugins-archive/*-buildbattleai-*.jar 2>/dev/null | tail -n +6 | xargs -r rm -f

            # Swap in the new JAR
            mv -v "$STAGED" plugins/
            ls -la plugins/ | grep -i buildbattleai || true

            # Paper logs go to logs/latest.log (Type=forking + tmux means stdout doesn't reach journald).
            # Truncate it so any "Done (...)" from a previous session can't produce a false positive.
            LOG=logs/latest.log
            mkdir -p logs
            : > "$LOG"

            echo "::Starting service::"
            sudo -n /usr/bin/systemctl start mc-1.8.service

            echo "::Waiting for server 'Done (...)' in $LOG::"
            DEADLINE=$(( $(date +%s) + 120 ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if ! sudo -n /usr/bin/systemctl is-active mc-1.8.service >/dev/null 2>&1; then
                echo "Service died during startup" >&2
                tail -n 120 "$LOG" 2>/dev/null >&2 || true
                exit 1
              fi
              if grep -qE 'Done \([0-9]+\.[0-9]+s\)' "$LOG" 2>/dev/null; then
                grep -E 'Done \(|MLService online|has been enabled|ERROR|SEVERE' "$LOG" | tail -n 20
                echo "Server reports Done — deploy verified."
                exit 0
              fi
              sleep 2
            done
            echo "Timeout: server did not reach 'Done (...)' within 120s" >&2
            tail -n 150 "$LOG" 2>/dev/null >&2 || true
            exit 1
          REMOTE

      - name: Close SSH ControlMaster
        if: always()
        run: |
          SSH_BASE="${{ steps.ssh.outputs.ssh_base }}"
          ssh $SSH_BASE -O exit "$VPS_USER@$VPS_HOST" 2>/dev/null || true
          rm -f ~/.ssh/cd_ed25519
