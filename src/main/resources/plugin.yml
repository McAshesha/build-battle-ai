name: BuildBattleAI
version: '${project.version}'
main: ru.ashesha.buildBattleAI.BuildBattleAI
authors: [ McAshesha ]
description: A competitive mini-game on building and explaining the buildings of AI

commands:
  bbai:
    description: Show BuildBattleAI plugin status
    usage: /bbai [demo <all|chat|rich|bar|title|tab|listname|reset>]
    aliases: [ buildbattleai ]
  shot:
    description: Render a screenshot of the build area
    usage: /shot <fileName>
